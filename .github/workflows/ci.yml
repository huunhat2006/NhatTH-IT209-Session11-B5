name: CI/CD cho Bài 5 - Tự động Build & Push sau khi Test

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Chạy Gradle Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Cấp quyền thực thi cho gradlew
        run: chmod +x gradlew
        
      - name: Chạy bài test Gradle
        run: ./gradlew test

  docker-build:
    name: Build and Push Docker Image
    needs: test # Bắt buộc Job test phải pass (màu xanh) mới chạy Job này
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Đăng nhập vào GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Đóng gói và Đẩy Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Thay thế 'tên-ứng-dụng' bằng tên ứng dụng của bạn
          tags: ghcr.io/${{ github.repository }}/spring-boot-app:latest
